<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sorry to see you go — Sanoja</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/icon128.png" />
<style>
  :root {
    color-scheme: light;
    --page: #ffffff;
    --surface-alt: #f7f8fa;
    --text-primary: #0b0e14;
    --text-secondary: #57606f;
    --text-muted: #8a92a3;
    --gridline: #e7e9ee;
    --accent: #2962ff;
    --accent-dark: #1a3fd6;
    --accent-soft: #e8edff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  header.nav { padding: 20px 0; border-bottom: 1px solid var(--gridline); }
  header.nav .wrap { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; text-decoration: none; color: var(--text-primary); }
  .brand img { width: 28px; height: 28px; border-radius: 50%; }

  .doc-hero { padding: 64px 0 8px; text-align: center; }
  .doc-hero h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .doc-hero p.sub { color: var(--text-secondary); font-size: 16px; max-width: 460px; margin: 0 auto; }

  .doc { max-width: 560px; margin: 0 auto; padding: 40px 24px 100px; }

  .card {
    background: var(--surface-alt);
    border: 1px solid var(--gridline);
    border-radius: 16px;
    padding: 28px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 10px;
  }

  .reasons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .reason {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 15px;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--gridline);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .reason:hover { border-color: var(--accent); background: var(--accent-soft); }
  .reason.selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .field { margin-bottom: 0; }
  textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--gridline);
    border-radius: 10px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 100px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .actions { margin-top: 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: var(--gridline); color: var(--text-muted); cursor: not-allowed; }
  .actions .note { font-size: 13px; color: var(--text-muted); }

  .alt {
    margin-top: 28px;
    text-align: center;
    font-size: 14.5px;
    color: var(--text-secondary);
  }

  footer { padding: 40px 0 56px; border-top: 1px solid var(--gridline); }
  footer .wrap {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px; font-size: 13.5px; color: var(--text-muted);
  }
  footer a { color: var(--text-secondary); text-decoration: none; margin-left: 18px; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 760px) {
    .doc-hero h1 { font-size: 26px; }
    .card { padding: 22px 18px; }
  }
</style>
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="assets/icon128.png" alt="" />Sanoja</a>
    </div>
  </header>

  <section class="doc-hero">
    <div class="wrap">
      <h1>Sorry to see you go</h1>
      <p class="sub">I'm the one person building Sanoja, so if something didn't work or wasn't worth keeping, I'd genuinely like to know. One click below, then hit send.</p>
    </div>
  </section>

  <article class="doc">
    <div class="card">
      <form id="uninstall-form">
        <div class="field" style="margin-bottom: 20px;">
          <label>What was the main reason?</label>
          <div class="reasons" id="reasons">
            <button type="button" class="reason" data-reason="Didn't work as expected / bugs">Didn't work as expected / bugs</button>
            <button type="button" class="reason" data-reason="Didn't understand how to use it">Didn't understand how to use it</button>
            <button type="button" class="reason" data-reason="Missing a feature I needed">Missing a feature I needed</button>
            <button type="button" class="reason" data-reason="Translations weren't accurate">Translations weren't accurate</button>
            <button type="button" class="reason" data-reason="Found a better alternative">Found a better alternative</button>
            <button type="button" class="reason" data-reason="No longer learning Finnish">No longer learning Finnish</button>
            <button type="button" class="reason" data-reason="Just trying it out">Just trying it out</button>
            <button type="button" class="reason" data-reason="Other">Other</button>
          </div>
        </div>
        <div class="field">
          <label for="un-message">Anything else? (optional)</label>
          <textarea id="un-message" name="message" placeholder="What would have made it worth keeping?"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit" id="un-submit" disabled>Send feedback</button>
          <span class="note">Opens your email app to send it to us.</span>
        </div>
      </form>
    </div>
  </article>

  <script>
    (function () {
      var selected = null;
      var reasonsWrap = document.getElementById('reasons');
      var submitBtn = document.getElementById('un-submit');

      reasonsWrap.addEventListener('click', function (e) {
        var btn = e.target.closest('.reason');
        if (!btn) return;
        selected = btn.getAttribute('data-reason');
        Array.prototype.forEach.call(reasonsWrap.querySelectorAll('.reason'), function (b) {
          b.classList.toggle('selected', b === btn);
        });
        submitBtn.disabled = false;
      });

      document.getElementById('uninstall-form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!selected) return;
        var message = document.getElementById('un-message').value.trim();

        var body = 'Reason: ' + selected;
        if (message) body += '\n\n' + message;

        var mailto = 'mailto:shahzainhtc@gmail.com'
          + '?subject=' + encodeURIComponent('Sanoja uninstall feedback')
          + '&body=' + encodeURIComponent(body);
        window.location.href = mailto;
      });
    })();
  </script>

  <footer>
    <div class="wrap">
      <span>Sanoja is an independent open-source project, MIT licensed.</span>
      <div>
        <a href="https://github.com/sanoja-app/sanoja-finnish-word-reader">GitHub</a>
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy</a>
      </div>
    </div>
  </footer>

</body>
</html>
