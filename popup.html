<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sanoja</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 260px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      color: #1c1c1e;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 2px;
    }
    .stat-line {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #6e6e73;
      margin: 0 0 14px;
    }
    .stat-line .streak {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      color: #eb6834;
      font-weight: 600;
      margin-left: 4px;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5ea;
      margin: 12px 0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .row:last-of-type {
      margin-bottom: 0;
    }
    .row-label {
      font-size: 13px;
      font-weight: 400;
    }
    .hint {
      font-size: 11px;
      color: #8e8e93;
      line-height: 1.4;
      margin-top: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 21px;
      flex-shrink: 0;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #d1d1d6;
      border-radius: 21px;
      transition: 0.15s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: 0.15s;
    }
    input:checked + .slider {
      background-color: #2962ff;
    }
    input:checked + .slider:before {
      transform: translateX(15px);
    }
    button.primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #2962ff;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover {
      background: #1e4bd8;
    }
    .ready-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      margin-left: 2px;
    }
    .feedback-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #8e8e93;
      text-decoration: none;
    }
    .feedback-link:hover {
      color: #2962ff;
    }
  </style>
</head>
<body>
  <h1>Sanoja</h1>
  <p class="stat-line" id="statLine">0 words</p>

  <div class="row">
    <span class="row-label">Enabled</span>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span class="row-label">Speak automatically</span>
    <label class="switch">
      <input type="checkbox" id="autoSpeak" />
      <span class="slider"></span>
    </label>
  </div>

  <p class="hint">Select or double-click a word on any page: English → Finnish, Finnish → English, detected automatically.</p>

  <hr />

  <button class="primary" id="reviewWords"></button>

  <a class="feedback-link" id="feedbackLink" href="#">Send feedback</a>

  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
